<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing Bot SVG Filter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #888;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 700px;
      margin-bottom: 1.5rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #aaa;
    }

    input, select {
      background: #1e1e30;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 100%;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #7c6bf0;
    }

    button {
      background: linear-gradient(135deg, #7c6bf0, #4f8ef7);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-bottom: 1.5rem;
    }

    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #preview {
      width: 100%;
      max-width: 800px;
      border-radius: 10px;
      overflow: hidden;
      background: #1a1a2e;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 0.9rem;
    }

    #preview svg {
      width: 100%;
      height: auto;
      display: block;
    }

    #download-link {
      display: none;
      margin-top: 1rem;
      color: #7c6bf0;
      text-decoration: none;
      font-size: 0.9rem;
    }

    #download-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Drawing Bot</h1>
  <p class="subtitle">Generative SVG art with filters</p>

  <div class="controls">
    <div class="field">
      <label>Width</label>
      <input type="number" id="width" value="800" min="100" max="2000" />
    </div>
    <div class="field">
      <label>Height</label>
      <input type="number" id="height" value="600" min="100" max="2000" />
    </div>
    <div class="field">
      <label>Shapes</label>
      <input type="number" id="shapeCount" value="30" min="1" max="200" />
    </div>
    <div class="field">
      <label>Filter</label>
      <select id="filter">
        <option value="">None</option>
      </select>
    </div>
    <div class="field">
      <label>Background</label>
      <input type="color" id="background" value="#1a1a2e" />
    </div>
  </div>

  <button id="generate-btn" onclick="generate()">Generate</button>

  <div id="preview">Click Generate to create artwork</div>
  <a id="download-link" download="drawing.svg">Download SVG</a>

  <script>
    async function loadFilters() {
      try {
        const res = await fetch("/api/filters");
        const data = await res.json();
        const select = document.getElementById("filter");
        data.filters.forEach(f => {
          const opt = document.createElement("option");
          opt.value = f;
          opt.textContent = f.charAt(0).toUpperCase() + f.slice(1);
          select.appendChild(opt);
        });
      } catch (e) {
        console.error("Failed to load filters", e);
      }
    }

    async function generate() {
      const btn = document.getElementById("generate-btn");
      const preview = document.getElementById("preview");
      btn.disabled = true;
      btn.textContent = "Generating…";

      const body = {
        width: parseInt(document.getElementById("width").value, 10),
        height: parseInt(document.getElementById("height").value, 10),
        shapeCount: parseInt(document.getElementById("shapeCount").value, 10),
        filter: document.getElementById("filter").value || null,
        background: document.getElementById("background").value,
      };

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        if (!res.ok) {
          const err = await res.json();
          preview.textContent = "Error: " + (err.error || res.statusText);
          return;
        }

        const svg = await res.text();
        preview.innerHTML = svg;

        const blob = new Blob([svg], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const link = document.getElementById("download-link");
        link.href = url;
        link.style.display = "inline";
      } catch (e) {
        preview.textContent = "Request failed: " + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate";
      }
    }

    loadFilters();
  </script>
</body>
</html>
