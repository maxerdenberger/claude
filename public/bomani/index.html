<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOMANI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .zones {
      display: flex;
      flex-direction: column;
      gap: 2.8rem;
      width: 100%;
      max-width: 560px;
    }

    .zone {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .city {
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #c02020;
    }

    /* ── flip clock row ── */
    .flip-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sep {
      font-size: 2rem;
      font-weight: 300;
      color: #444;
      line-height: 1;
      padding: 0 1px;
      margin-bottom: 4px;
    }

    /* ── single digit card ── */
    .digit {
      width: 44px;
      height: 60px;
      position: relative;
      perspective: 200px;
    }

    /* shared face styles */
    .digit .face {
      position: absolute;
      width: 100%;
      height: 50%;
      left: 0;
      overflow: hidden;
      background: #1a1a1a;
    }

    /* the number shown inside each face */
    .digit .face .num {
      position: absolute;
      width: 100%;
      height: 200%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0;
      color: #f0f0f0;
    }

    /* static faces */
    .digit .top-face {
      top: 0;
      border-radius: 4px 4px 0 0;
      border-bottom: 1px solid #0a0a0a;
    }
    .digit .top-face .num { top: 0; }

    .digit .bot-face {
      top: 50%;
      border-radius: 0 0 4px 4px;
    }
    .digit .bot-face .num { bottom: 0; }

    /* ── animated flap ── */
    .digit .flap {
      position: absolute;
      width: 100%;
      height: 50%;
      left: 0;
      transform-origin: bottom center;
      transform-style: preserve-3d;
      z-index: 10;
    }

    /* front of flap = old top half */
    .digit .flap .flap-front,
    .digit .flap .flap-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      overflow: hidden;
      background: #1a1a1a;
    }

    .digit .flap .flap-front {
      border-radius: 4px 4px 0 0;
      border-bottom: 1px solid #0a0a0a;
    }
    .digit .flap .flap-back {
      transform: rotateX(180deg);
      border-radius: 0 0 4px 4px;
    }

    .digit .flap .flap-front .num { top: 0; }
    .digit .flap .flap-back .num  { bottom: 0; transform: rotateX(180deg); }

    .digit .flap .flap-front .num,
    .digit .flap .flap-back .num {
      position: absolute;
      width: 100%;
      height: 200%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 300;
      color: #f0f0f0;
    }

    /* shading overlay for depth */
    .digit .flap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.15), transparent);
      pointer-events: none;
      z-index: 2;
    }

    /* running animation */
    @keyframes flip {
      0%   { transform: rotateX(0deg); }
      100% { transform: rotateX(-180deg); }
    }

    .digit .flap.go {
      animation: flip 0.45s cubic-bezier(0.45, 0, 0.55, 1) forwards;
    }

    /* thin divider line across the middle of each card */
    .digit::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: #0a0a0a;
      z-index: 20;
    }
  </style>
</head>
<body>

<div class="zones" id="zones"></div>

<script>
const ZONES = [
  { city: 'New York', tz: 'America/New_York' },
  { city: 'London',   tz: 'Europe/London'    },
  { city: 'Tokyo',    tz: 'Asia/Tokyo'       },
  { city: 'Sydney',   tz: 'Australia/Sydney' },
  { city: 'Dubai',    tz: 'Asia/Dubai'       },
];

/* ── build DOM ── */
const container = document.getElementById('zones');

ZONES.forEach(z => {
  const zone = document.createElement('div');
  zone.className = 'zone';

  const city = document.createElement('div');
  city.className = 'city';
  city.textContent = z.city;

  const row = document.createElement('div');
  row.className = 'flip-row';
  row.id = 'row-' + z.tz;

  /* HH : MM : SS  → 6 digit slots + 2 separators */
  for (let i = 0; i < 6; i++) {
    if (i === 2 || i === 4) {
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = ':';
      row.appendChild(sep);
    }
    const digit = buildDigit();
    digit.dataset.idx = i;
    digit.dataset.tz  = z.tz;
    row.appendChild(digit);
  }

  zone.appendChild(city);
  zone.appendChild(row);
  container.appendChild(zone);
});

function buildDigit() {
  const d = document.createElement('div');
  d.className = 'digit';

  /* static top (shows current value upper half) */
  const topFace = document.createElement('div');
  topFace.className = 'face top-face';
  const topNum = document.createElement('div');
  topNum.className = 'num';
  topNum.textContent = '0';
  topFace.appendChild(topNum);

  /* static bottom (shows current value lower half) */
  const botFace = document.createElement('div');
  botFace.className = 'face bot-face';
  const botNum = document.createElement('div');
  botNum.className = 'num';
  botNum.textContent = '0';
  botFace.appendChild(botNum);

  /* animated flap */
  const flap = document.createElement('div');
  flap.className = 'flap';

  const flapFront = document.createElement('div');
  flapFront.className = 'flap-front';
  const ffNum = document.createElement('div');
  ffNum.className = 'num';
  ffNum.textContent = '0';
  flapFront.appendChild(ffNum);

  const flapBack = document.createElement('div');
  flapBack.className = 'flap-back';
  const fbNum = document.createElement('div');
  fbNum.className = 'num';
  fbNum.textContent = '0';
  flapBack.appendChild(fbNum);

  flap.appendChild(flapFront);
  flap.appendChild(flapBack);

  d.appendChild(topFace);
  d.appendChild(botFace);
  d.appendChild(flap);

  /* shortcut refs */
  d._topNum  = topNum;
  d._botNum  = botNum;
  d._ffNum   = ffNum;
  d._fbNum   = fbNum;
  d._flap    = flap;
  d._current = '0';

  return d;
}

/* ── flip a single digit element to a new character ── */
function flipTo(d, next) {
  if (d._current === next) return;
  const prev = d._current;

  /* flap front = old top = prev digit */
  d._ffNum.textContent = prev;
  /* flap back  = new bottom half of next */
  d._fbNum.textContent = next;
  /* new top already visible behind flap */
  d._topNum.textContent = next;
  /* bottom stays prev until flap lands */
  d._botNum.textContent = prev;

  /* restart animation */
  const flap = d._flap;
  flap.classList.remove('go');
  void flap.offsetWidth; /* reflow */
  flap.classList.add('go');

  /* after animation, settle bottom and reset flap-front to current */
  flap.addEventListener('animationend', () => {
    d._botNum.textContent = next;
    d._ffNum.textContent  = next;
    flap.classList.remove('go');
  }, { once: true });

  d._current = next;
}

/* ── tick ── */
function tick() {
  const now = new Date();
  ZONES.forEach(z => {
    const str = now.toLocaleTimeString('en-GB', {
      timeZone: z.tz,
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    }).replace(/:/g, ''); /* "HHmmss" */

    const row = document.getElementById('row-' + z.tz);
    const digits = row.querySelectorAll('.digit');
    digits.forEach((d, i) => flipTo(d, str[i]));
  });
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
